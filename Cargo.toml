[workspace]
members = [
    "src/file-explorer-ui",
    "src/http-server",
    "test",
]
default-members = ["src/http-server"]
resolver = "2"

[workspace.package]
authors = ["Leo Borai <estebanborai@gmail.com>"]
categories = ["web-programming", "web-programming::http-server"]
description = "Simple and configurable command-line HTTP server"
documentation = "https://http-server-rs.github.io"
edition = "2024"
include = ["/ui", "/src/"]
keywords = ["configurable", "http", "server", "serve", "static"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/http-server-rs/http-server"
readme = "./README.md"
version = "1.0.0-pre.3a26934"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
async-stream = "0.3.6"
bytes = "1.12.1"
chrono = "0.4.45"
clap = "4.6.6"
dirs = "6.0.0"
futures = "0.3.33"
gloo = "0.12.0"
gloo-file = "0.4.0"
handlebars = "6.4.3"
humansize = "2.1.3"
http = "1.5.0"
http-body-util = "0.1.4"
hyper = "1.11.0"
hyper-util = "0.1.20"
leptos = "0.8.20"
leptos_meta = "0.8.6"
leptos_router = "0.8.15"
leptos-use = "0.19.0"
libloading = "0.9.0"
local-ip-address = "0.6.13"
mime_guess = "2.0.5"
multer = "3.1.0"
percent-encoding = "2.3.2"
reqwest = "0.13.4"
rust-embed = "8.12.0"
rustc_version = "0.4.1"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = "1.53.1"
tokio-util = "0.7.19"
toml = "1.1.4"
tower = "0.5.3"
tower-http = "0.7.0"
tower-layer = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wait-on = "0.0.14"
web-sys = "0.3.104"
xprocess = "0.0.4"
