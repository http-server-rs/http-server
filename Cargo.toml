[package]
name = "http-server"
authors = ["Leo Borai <estebanborai@gmail.com>"]
categories = ["web-programming", "web-programming::http-server"]
description = "Simple and configurable command-line HTTP server"
documentation = "https://http-server-rs.github.io"
edition = "2024"
include = ["/src/"]
keywords = ["configurable", "http", "server", "serve", "static"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/http-server-rs/http-server"
readme = "./README.md"
version = "1.0.0-pre.6bd810e"

[[bin]]
name = "http-server"
path = "src/main.rs"

[workspace]
members = ["test"]
resolver = "2"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["env", "derive", "std"] }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["full"] }
local-ip-address = { workspace = true }
mime_guess = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "signal", "macros"] }
topcoat = { workspace = true, features = ["router", "view", "multipart"] }
tower-http = { workspace = true, features = ["cors"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
async-stream = "0.3.6"
bytes = "1.12.1"
chrono = "0.4.45"
clap = "4.6.6"
dirs = "7.0.0"
futures = "0.3.33"
http = "1.5.0"
http-body-util = "0.1.4"
hyper = "1.11.0"
hyper-util = "0.1.20"
libloading = "0.9.0"
local-ip-address = "0.6.13"
mime_guess = "2.0.5"
multer = "3.1.0"
percent-encoding = "2.3.2"
reqwest = "0.13.4"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = "1.53.1"
tokio-util = "0.7.19"
toml = "1.1.4"
topcoat = { version = "0.12.1", default-features = false }
tower = "0.5.3"
tower-http = "0.7.0"
tower-layer = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wait-on = "0.0.14"
xprocess = "0.0.4"
